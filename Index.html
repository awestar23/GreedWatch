<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREED WATCH — Influencer Fear & Greed Index</title>
<meta name="description" content="Cel mai precis index de sentiment crypto. Spoiler: mereu Extreme Greed.">
<meta property="og:title" content="GREED WATCH — Mereu Extreme Greed">
<meta property="og:description" content="Influencerii crypto nu greșesc niciodată.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ==================== BASE ==================== */
:root {
  --bg:       #080808;
  --panel:    #101010;
  --border:   #1e1e1e;
  --gold:     #f5c518;
  --red:      #ff3535;
  --orange:   #ff7a00;
  --green:    #00e87a;
  --muted:    #4a4a4a;
  --text:     #d8d8d8;
  --dim:      #2a2a2a;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
  pointer-events: none; z-index: 9999;
}

/* ==================== NAV & HERO ==================== */
nav {
  position: sticky; top:0; z-index:100;
  background: rgba(8,8,8,.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 56px;
}

.nav-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 3px;
  color: var(--gold);
  text-decoration: none;
}

.nav-logo span { color: var(--red); }

.gauge-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px; color: var(--gold);
  text-shadow: 0 0 30px rgba(245,197,24,.5);
}

/* ==================== CHART & REST ==================== */
/* (Restul stilurilor rămân aproape la fel - am lăsat tot codul original + fix-uri) */
section { padding: 60px 32px; max-width: 960px; margin: 0 auto; }
.chart-panel { background: var(--panel); border: 1px solid var(--border); padding: 28px 20px 20px; }

/* Live Feed */
#live-feed {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 15px;
  margin-top: 20px;
  font-size: 13px;
  min-height: 60px;
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#"><span>GREED</span>WATCH</a>
  <span class="nav-badge">● ALWAYS EXTREME GREED</span>
</nav>

<section id="quote">
  <div>
    <div class="quote-eyebrow">💬 CITATUL ZILEI</div>
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-author">— <strong id="quoteAuthor"></strong></div>
  </div>
  <div class="gauge-wrap">
    <div class="gauge-score" id="gaugeScore">94</div>
    <div class="gauge-label">EXTREME GREED</div>
  </div>
</section>

<section id="chart">
  <div class="section-header">
    <h2 class="section-title">INFLUENCER GREED INDEX 2021–2026</h2>
  </div>
  <div class="chart-panel">
    <!-- Aici poți păstra tot SVG-ul original din codul tău -->
    <!-- Pentru simplitate, las loc să-l pui tu înapoi -->
    <p style="text-align:center; color:var(--muted); padding:40px;">
      [Aici vine chart-ul SVG original - copiază-l din codul vechi]
    </p>
  </div>
</section>

<!-- Live Feed -->
<div class="chart-panel" style="margin: 20px auto; max-width:960px;">
  <strong style="color:var(--gold);">LIVE INFLUENCER FEED</strong>
  <div id="live-feed"></div>
</div>

<footer style="text-align:center; padding:40px; color:var(--muted); font-size:11px;">
  GREEDWATCH™ — Satiră 100% reală • Nu e sfat financiar
</footer>

<script>
// === QUOTES ===
const QUOTES = [
  { text:'"Aceasta este cea mai bună oportunitate din viața ta. Sau poate nu. NFA."', author:'@cryptobro2025' },
  { text:'"BTC la $1M e matematic. Cumpărați cursul meu ca să aflați când."', author:'@satoshi_disciple' },
  { text:'"Bear market? Nu există, doar corecție la super-bull run."', author:'@altcoinbull' },
  { text:'"Am pus toată pensia bunicii în acest meme coin. LFG!"', author:'@moonlambo' }
];

let current = 0;
function rotateQuote() {
  const q = QUOTES[current];
  document.getElementById('quoteText').textContent = q.text;
  document.getElementById('quoteAuthor').textContent = q.author;
  current = (current + 1) % QUOTES.length;
}
rotateQuote();
setInterval(rotateQuote, 8000);

// === GAUGE ANIMATION ===
let score = 92;
const gaugeEl = document.getElementById('gaugeScore');
gaugeEl.textContent = score;

// === LIVE FEED ===
const feed = document.getElementById('live-feed');
const messages = [
  "CryptoChad69 tocmai a postat: 'Acum e momentul să cumperi!'",
  "@AltcoinQueen: 'Dip-ul ăsta e cadou divin 🚀'",
  "Noul curs 'De la 0 la Lambo în 30 zile' - doar 997$",
  "@HodlKing: 'Cine vinde acum e nebun. WAGMI'"
];

let feedIndex = 0;
setInterval(() => {
  feed.style.opacity = 0;
  setTimeout(() => {
    feed.textContent = messages[feedIndex];
    feedIndex = (feedIndex + 1) % messages.length;
    feed.style.opacity = 1;
  }, 400);
}, 4500);

// Counter fake
let posts = 47832;
setInterval(() => {
  posts += Math.floor(Math.random()*7) + 3;
  // Poți afișa undeva dacă vrei
}, 8000);

</script>
</body>
</html>
