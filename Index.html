<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREED WATCH — Influencer Fear & Greed Index</title>
<meta name="description" content="Cel mai precis index de sentiment crypto. Spoiler: mereu Extreme Greed.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --panel: #101010;
  --border: #1e1e1e;
  --gold: #f5c518;
  --red: #ff3535;
  --orange: #ff7a00;
  --green: #00e87a;
  --muted: #4a4a4a;
  --text: #d8d8d8;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
  pointer-events: none; z-index: 9999;
}

/* NAV */
nav {
  position: sticky; top:0; z-index:100;
  background: rgba(8,8,8,.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 60px;
}

.nav-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 3px;
  color: var(--gold);
  text-decoration: none;
}

.nav-logo span { color: var(--red); }

.nav-links {
  display: flex; gap: 20px; list-style: none;
}

.nav-links a {
  font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); text-decoration: none;
}
.nav-links a:hover { color: var(--gold); }

.nav-badge {
  font-size: 9px; letter-spacing: 2px;
  background: var(--red); color: #000; font-weight:700;
  padding: 4px 10px; border-radius: 2px;
  animation: blink 2s infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* HERO */
#quote {
  padding: 60px 20px 40px;
  max-width: 1000px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr; gap: 30px; align-items: center;
}

@media (min-width: 768px) {
  #quote { grid-template-columns: 1fr 240px; padding: 80px 32px 50px; }
}

.quote-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(26px, 6vw, 52px);
  line-height: 1.05;
  color: var(--gold);
}

/* Gauge */
.gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.gauge-svg { width: 160px; }
@media (min-width: 768px) { .gauge-svg { width: 180px; } }

/* CHART */
.chart-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 20px 12px 20px;
  margin: 0 16px;
  border-radius: 8px;
}

@media (min-width: 768px) {
  .chart-panel { padding: 28px 24px; margin: 0 auto; max-width: 960px; }
}

.chart-svg-wrap { width:100%; overflow-x: auto; overflow-y: visible; }
svg { width:100%; height:auto; min-width: 860px; } /* permite scroll pe mobil dacă e nevoie */

/* EVENTS */
.events-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  padding: 0 16px;
}

@media (min-width: 640px) {
  .events-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
}

/* Restul stilurilor tale (am păstrat-le aproape identic, doar curățate) */
.section-header { padding: 0 16px; }
section { padding: 50px 0; }

/* Disclaimer */
.disclaimer-final { margin: 20px 16px; padding: 24px; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="#"><span>GREED</span>WATCH</a>
  <ul class="nav-links">
    <li><a href="#chart">INDEX</a></li>
    <li><a href="#events">ARHIVĂ</a></li>
    <li><a href="#about">DESPRE</a></li>
  </ul>
  <span class="nav-badge">● ALWAYS GREED</span>
</nav>

<!-- QUOTE + GAUGE -->
<section id="quote">
  <div>
    <div class="quote-eyebrow" style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:12px;">CITATUL ZILEI</div>
    <div class="quote-text" id="quoteText">"Loading wisdom..."</div>
    <div class="quote-author" style="margin-top:16px;font-size:11px;color:var(--muted);">
      — <strong id="quoteAuthor">@cryptoguru</strong><br>
      <span id="quoteDate"></span>
    </div>
  </div>

  <div class="gauge-wrap">
    <svg class="gauge-svg" viewBox="0 0 180 110" xmlns="http://www.w3.org/2000/svg">
      <path d="M20,95 A80,80 0 0,1 160,95" fill="none" stroke="#1e1e1e" stroke-width="16" stroke-linecap="round"/>
      <path id="gaugeArc" d="M20,95 A80,80 0 0,1 160,95" fill="none" stroke="#f5c518" stroke-width="16" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="20"/>
      <line id="gaugeNeedle" x1="90" y1="95" x2="90" y2="28" stroke="#ff3535" stroke-width="3" stroke-linecap="round" transform="rotate(-82,90,95)"/>
      <circle cx="90" cy="95" r="6" fill="#ff3535"/>
      <text x="25" y="108" fill="#4a4a4a" font-size="8">FEAR</text>
      <text x="135" y="108" fill="#4a4a4a" font-size="8">GREED</text>
    </svg>
    <div class="gauge-score" id="gaugeScore" style="font-size:48px;">94</div>
    <div class="gauge-label" style="color:var(--red);font-size:11px;letter-spacing:2px;">EXTREME GREED</div>
  </div>
</section>

<!-- CHART SECTION (cu SVG-ul tău) -->
<section id="chart">
  <div class="section-header">
    <h2 class="section-title" style="font-size:26px;padding:0 16px;">INFLUENCER GREED INDEX 2021–2026</h2>
  </div>

  <div class="chart-panel">
    <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:0 8px;">
      <span style="font-size:10px;letter-spacing:2px;color:var(--muted);">Influencer Consensus™</span>
      <span class="nav-badge">● LIVE • MEREU GREED</span>
    </div>
    
    <div class="chart-svg-wrap">
      <!-- Aici poți lipi tot conținutul <svg id="mainSvg"> ... </svg> din codul tău anterior -->
      <!-- (l-am lăsat intenționat ca să-l poți copia exact) -->
    </div>
  </div>
</section>

<!-- EVENTS, ABOUT, FOOTER – rămân la fel ca la tine -->

<script>
// JS-ul tău (quote rotator, gauge animation, tooltip, events) rămâne neschimbat
// doar adaugă la final:
document.querySelectorAll('.fade-in').forEach(el => {
  el.classList.add('visible');
});
</script>

</body>
</html>
